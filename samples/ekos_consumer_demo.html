function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(snap, mode){
  document.getElementById('mode').textContent = mode;
  document.getElementById('status').innerHTML =
    '✅ 已从<span class="ok">'+esc(mode)+'</span>取得本体库数据：法规 1 / 专题 1 / 93号文检查项 13（本页抽样 3）/ 在册控制 '+snap.controls_total+' 条。';
  const law=snap.law, t=snap.topic;
  if(law){document.getElementById('law-card').hidden=false;
    document.getElementById('law').innerHTML='<span class="tag">'+esc(law.type)+'</span><b>'+esc(law.title)+'</b><div class="muted">'+esc(law.summary)+'</div>';}
  if(t){document.getElementById('topic-card').hidden=false;
    document.getElementById('topic').innerHTML='<span class="tag">'+esc(t.type)+'</span><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.summary)+'</div>';}
  if(snap.checks){document.getElementById('checks-card').hidden=false;
    document.getElementById('checks').innerHTML = snap.checks.map(c=>
      '<div style="margin:8px 0"><span class="tag">'+esc(c.checkCode)+'</span>'+esc(c.title)+
      ' <span class="muted">['+esc(c.domain)+' / '+esc(c.priority)+' / '+esc(c.articleNo)+']</span>'+
      '<pre>'+esc((c.summary||'').slice(0,120))+'…</pre></div>').join('');}
  if(snap.golden11){document.getElementById('golden-card').hidden=false;
    document.getElementById('golden').innerHTML='<span class="tag">'+esc(snap.golden11.checkCode)+'</span>'+esc(snap.golden11.title)+
    ' <span class="muted">['+esc(snap.golden11.domain)+' / '+esc(snap.golden11.priority)+']</span>';}
}

})();
