  <text x="1206" y="52" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="end">本体驱动 · 数据驱动</text>
  <text x="1206" y="78" fill="#D8E3FF" font-size="13" text-anchor="end">Ontology-Driven Data Security Governance</text>

